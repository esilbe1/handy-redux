name: Handy
options:
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  DEVELOPMENT_TEAM: 2D8ALY3LCL
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    majorVersion: 0.9.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    majorVersion: 0.9.1

targets:
  Handy:
    type: application
    platform: iOS
    sources:
      - path: Handy
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handy.handy-app
        INFOPLIST_FILE: Handy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Handy/Handy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 1
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(TW_APP_PROFILE)
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - target: HandyKeyboard
      - target: HandyWidget
      - target: HandyShare

  HandyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HandyWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handy.handy-app.widget
        INFOPLIST_FILE: HandyWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HandyWidget/HandyWidget.entitlements
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: true
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(TW_WG_PROFILE)

  HandyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HandyShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handy.handy-app.share
        INFOPLIST_FILE: HandyShare/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HandyShare/HandyShare.entitlements
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: true
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(TW_SH_PROFILE)

  HandyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: HandyKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handy.handy-app.keyboard
        INFOPLIST_FILE: HandyKeyboard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HandyKeyboard/HandyKeyboard.entitlements
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: true
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(TW_KB_PROFILE)

schemes:
  Handy:
    build:
      targets:
        Handy: all
        HandyKeyboard: all
        HandyWidget: all
        HandyShare: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HandyKeyboard:
    build:
      targets:
        HandyKeyboard: all
    run:
      config: Debug
      askForAppToLaunch: true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
